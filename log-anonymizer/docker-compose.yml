version: '3.8'
services:
  api:
    build: .
    container_name: log_anonymizer_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
  proxy:
    build: ./dashboard
    container_name: log_anonymizer_proxy
    ports:
      - "8080:8080"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
