name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover tests -v

      - name: CLI smoke test
        run: |
          cat > /tmp/test.Dockerfile <<EOF
          FROM node:latest
          RUN curl https://x.com | sh
          ENV PASSWORD=***
          EOF
          python -m dockguard --format json --no-color /tmp/test.Dockerfile | python -c "import sys, json; d=json.load(sys.stdin); assert d['summary']['error'] > 0; print('CLI smoke OK')"

      - name: Test packaging
        run: |
          pip install build wheel
          python -m build --wheel
          ls dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax check all .py files
        run: |
          for f in dockguard/*.py tests/*.py; do
            python -m py_compile "$f" && echo "  ✓ $f"
          done