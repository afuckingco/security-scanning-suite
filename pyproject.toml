[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ops-suite"
version = "0.1.0"
description = "Unified security operations suite: anomaly detection + secure package registry proxy"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Afiq Andico", email = "[REDACTED]"}]
license = {text = "MIT"}
keywords = ["security", "anomaly-detection", "registry-proxy", "ci", "docker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

# runtime dependencies
dependencies = [
    "pytorch-lightning",
    "torch",
    "fastapi",
    "uvicorn",
    "pandas",
    "scikit-learn",
    "rich",
    "click",
    "gdown",
]
