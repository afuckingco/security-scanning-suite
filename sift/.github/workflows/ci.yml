name: CI & Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binary
        run: go build -ldflags="-s -w" -v -o sift .

      - name: Verify Binary
        run: |
          ./sift --version
          ./sift --json . > results.json
          cat results.json | jq . > /dev/null && echo "✅ JSON output valid"

  release:
    name: Cross-Compile Release
    needs: test-and-build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build all platforms
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o sift-linux-amd64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o sift-macos-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o sift-macos-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o sift-windows-amd64.exe .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: sift-*
