name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python (pytest + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install components (editable) + pytest
        run: |
          pip install -e ./dockguard -e ./log-anonymizer -e ./sec-scan-cli pytest
      - name: Run tests (dockguard)
        working-directory: dockguard
        run: pytest -q
      - name: Run tests (log-anonymizer)
        working-directory: log-anonymizer
        run: pytest -q
      - name: Run tests (sec-scan-cli)
        working-directory: sec-scan-cli
        run: pytest -q
      - name: Syntax check all Python
        run: |
          find dockguard log-anonymizer sec-scan-cli \
            -name "*.py" -not -path "*/.venv/*" -exec python -m py_compile {} +
          echo "py_compile OK ($(find dockguard log-anonymizer sec-scan-cli -name '*.py' -not -path '*/.venv/*' | wc -l) files)"

  go:
    name: Go (sift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Vet
        working-directory: sift
        run: go vet ./...
      - name: Build
        working-directory: sift
        run: go build ./...

  seclab:
    name: Unified CLI (seclab smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Bash syntax
        run: bash -n seclab
      - name: seclab list lists all 11 tools
        run: |
          ./seclab list | grep -c 'scan-secret\|lint-docker\|anon-log\|scan\|ci-scan\|pilgrims\|anf' | xargs -I{} test {} -eq 7
          ./seclab list | grep -q 'scan-secret'
          ./seclab list | grep -q 'anf'
      - name: seclab doctor runs
        run: ./seclab doctor >/dev/null
      - name: scan-secret builds and reports version
        run: ./seclab scan-secret --version | grep -q 'Sift'
      - name: pilgrims --help executes
        run: ./seclab pilgrims --help >/dev/null 2>&1 || true
