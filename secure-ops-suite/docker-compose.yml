version: '3.8'
services:
  proxy:
    build: ./dashboard
    container_name: secure_proxy
    ports:
      - "8080:8080"
    environment:
      - UPSTREAM_REGISTRY=https://registry.npmjs.org
    volumes:
      - ./scripts:/app/scripts
      - ./bin:/app/bin
      
  analyzer:
    build: ./src/analyzer
    container_name: anomaly_analyzer
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs

  collector:
    image: python:3.11-slim
    container_name: log_collector
    command: ["/bin/bash", "-c", "./scripts/collect_logs.sh && tail -f /dev/null"]
    volumes:
      - ./scripts:/app/scripts
      - ./logs:/app/logs
      - ./secure-ci-pipeline/scripts:/src/secure-ci-pipeline/scripts
